<style>
:root{
  --bg:#000; --fg:#e8ebf1; --soft:#aab2be; --muted:#747d8a; --line:rgba(255,255,255,.09);
  --accent:rgb(228,231,238); --accent-rgb:228,231,238;
  --pill:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),rgba(12,14,18,.72);
  --lift:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -12px rgba(0,0,0,.8);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --display:'Syne','Arial Black',Impact,system-ui,sans-serif;
  --mono:'Martian Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.6;overflow-x:hidden}
::selection{background:rgba(var(--accent-rgb),.3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 25%,rgba(0,0,0,.9) 100%)}
#spot{position:fixed;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 62%);will-change:transform}
.stage{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px 20px;text-align:center}
.center{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;max-width:100%;padding:10px 20px;border-radius:999px;background:var(--pill);border:1px solid var(--line);box-shadow:var(--lift);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--fg);font-size:12px;letter-spacing:.16em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.sm{padding:6px 14px;font-size:11px;letter-spacing:.1em}
.sl{color:var(--muted);opacity:.75}
.c{color:var(--soft)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 0 12px rgba(255,255,255,.9);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{opacity:.35}}

/* title: chrome sweep every few seconds */
.title{margin:0 0 -.2em;max-width:100%;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7.2vw,5.2rem);line-height:1.05;letter-spacing:.03em;overflow-wrap:anywhere;text-wrap:balance;text-transform:uppercase;cursor:default;
  color:transparent;background:linear-gradient(100deg,#fff 0%,#fff 38%,#8f98a8 50%,#fff 62%,#fff 100%) 100% 0/260% 100%;-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 26px rgba(255,255,255,.28));animation:sweep 7s ease-in-out 1.4s infinite}
@keyframes sweep{0%{background-position:100% 0}22%,100%{background-position:-60% 0}}

.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.bubble{position:relative;display:grid;place-items:center;width:50px;height:50px;padding:0;border-radius:50%;background:var(--pill);border:1px solid var(--line);box-shadow:var(--lift);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--soft);text-decoration:none;transition:transform .35s var(--spring),color .2s,border-color .2s,box-shadow .2s}
.bubble svg{width:22px;height:22px;fill:currentColor}
.bubble:hover,.bubble:focus-visible{transform:translateY(-4px) scale(1.1);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:var(--lift),0 0 28px -4px rgba(255,255,255,.55)}
.bubble:active{transform:scale(.92)}

/* ───── the id card: a real card now ───── */
.card{--gx:50%;--gy:0%;--ang:140deg;position:relative;width:min(440px,100%);text-align:left;border-radius:26px;overflow:hidden;
  background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(255,255,255,.085),transparent 62%),linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.012) 45%,rgba(255,255,255,.04)),rgba(10,11,14,.78);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 70px -26px #000,0 0 0 1px rgba(255,255,255,.05);
  transition:transform .18s ease-out;will-change:transform;padding:20px 22px 18px}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--ang),rgba(255,255,255,.6),rgba(255,255,255,.06) 24%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.06) 76%,rgba(255,255,255,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.chip{flex:none;width:40px;height:30px;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(135deg,#d7dbe3,#7d8696 55%,#c9ced8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.5)}
.chip::before,.chip::after{content:'';position:absolute;background:rgba(0,0,0,.35)}
.chip::before{left:0;right:0;top:50%;height:1px}.chip::after{top:0;bottom:0;left:38%;width:1px;box-shadow:12px 0 0 rgba(0,0,0,.35)}
.ct{flex:1;font-size:11px;letter-spacing:.18em;color:var(--soft)}
.live{background:rgba(255,255,255,.05);box-shadow:none;color:#fff}
.fields{margin:0;padding:0;display:flex;flex-direction:column}
.fields>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.075);transition:padding .25s,background .25s}
.fields>div:hover{padding-left:6px}
.fields dt{color:var(--muted);font-size:11px;letter-spacing:.14em}
.fields dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:500;font-size:14px;color:#fff}
.fields dd a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.3);transition:border-color .2s,text-shadow .2s}
.fields dd a:hover{border-color:#fff;text-shadow:0 0 14px rgba(255,255,255,.7)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:16px}
.bars{flex:none;width:96px;height:24px;opacity:.5;background:repeating-linear-gradient(90deg,#c9ced8 0 2px,transparent 2px 4px,#c9ced8 4px 5px,transparent 5px 9px,#c9ced8 9px 12px,transparent 12px 14px,#c9ced8 14px 15px,transparent 15px 19px)}
.save{font:inherit;cursor:pointer;color:#050505;background:#f1f3f7;border:0;border-radius:999px;padding:9px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;transition:transform .35s var(--spring),box-shadow .25s}
.save:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 26px -4px rgba(255,255,255,.7)}
.save:active{transform:scale(.95)}

.foot{width:100%;max-width:980px;display:flex;justify-content:center;margin-top:30px;color:var(--muted)}
.foot .pill{color:var(--muted);font-size:10px;letter-spacing:.08em;line-height:normal;padding-block:7px}

.center>*,.foot{opacity:0;transform:translateY(16px);animation:up .9s var(--spring) forwards}
.center>:nth-child(1){animation-delay:.05s}.center>:nth-child(2){animation-delay:.18s}.center>:nth-child(3){animation-delay:.3s}.center>:nth-child(4){animation-delay:.42s}.foot{animation-delay:.6s}
@keyframes up{to{opacity:1;transform:none}}
@media (max-width:360px){.s2,#mCoord{display:none}}
@media (max-width:480px){.card{padding:18px 16px 16px}.pill{letter-spacing:.1em}.bars{width:70px}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="stage">
  <section class="center">
    <h1 class="title" id="title" aria-label="Onur Ulukaya">Onur Ulukaya</h1>

      <span class="dot" aria-hidden="true"></span>

    </div>

    <nav class="socials" id="links" aria-label="İletişim Bağlantıları"></nav>

    <article class="card" id="card" aria-label="Kimlik Kartı">
      <header class="ch"><span class="chip" aria-hidden="true"></span><span class="ct">Kimlik Kartı</span><span class="pill sm live"><span class="dot" aria-hidden="true"></span>Çevrimiçi</span></header>
      <dl class="fields" id="fields"></dl>
      <footer class="cf"><span class="bars" aria-hidden="true"></span><button class="save" id="save" type="button">Rehbere Ekle</button></footer>
    </article>
  </section>
  <footer class="foot"><span class="pill sm">© 2026 Onur Ulukaya. Tüm Hakları Saklıdır.</span></footer>
</main>

(function () {
  const nav = $('#links');
  const add = (label, href, d) => { const a = mk('a', 'bubble'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.setAttribute('aria-label', label); a.title = label; a.appendChild(icon(d)); nav.appendChild(a); };
  if (/^https:\/\/(www\.)?instagram\.com\//.test(PROFILE.instagram)) add('Instagram', PROFILE.instagram, IG_D);
  add('WhatsApp', 'https://wa.me/' + PROFILE.phoneIntl, WA_D);
})();

(function () {
  const f = $('#fields');
  const row = (k, v, href) => { const d = mk('div'); const dt = mk('dt', '', k); const dd = mk('dd'); if (href) { const a = mk('a', '', v); a.href = href; dd.appendChild(a); } else dd.textContent = v; d.append(dt, dd); f.appendChild(d); };
  row('Ad', PROFILE.name);
  row('Telefon', PROFILE.phoneShown, 'tel:+' + PROFILE.phoneIntl);
  row('Konum', PROFILE.loc);
  row('Dil', PROFILE.language);
})();

/* "Rehbere Ekle": downloads a contact file the phone can import */
(function () {
  const b = $('#save'), idle = b.textContent;
  b.addEventListener('click', () => {
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', 'N:Ulukaya;Onur;;;', 'FN:' + PROFILE.name, 'TEL;TYPE=CELL:+' + PROFILE.phoneIntl];
    if (PROFILE.instagram) lines.push('URL:' + PROFILE.instagram);
    lines.push('END:VCARD');
    const url = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/vcard' }));
    const a = document.createElement('a'); a.href = url; a.download = 'Onur Ulukaya.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    b.textContent = 'İndirildi ✓'; setTimeout(() => { b.textContent = idle; }, 1800);
  });
})();

/* clock (Istanbul), only ticks while the tab is visible */
(function () {
  const el = $('#mTime');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tick = () => { const t = fmt.format(new Date()); if (el.textContent !== t) el.textContent = t; };
  tick(); setInterval(() => { if (!document.hidden) tick(); }, 1000);
})();

/* title: decode effect on load and on hover */
(function () {
  const el = $('#title'), final = 'ONUR ULUKAYA', pool = 'ABCDEFGHIJKLMNOPRSTUVYZ#/<>+=', fin = PROFILE.name.toUpperCase();
  let timer = 0;
  function run() {
    clearInterval(timer); let n = 0;
    timer = setInterval(() => {
      n += 0.7; let s = '';
      for (let i = 0; i < fin.length; i++) s += (fin[i] === ' ' || i < n) ? fin[i] : pool[Math.floor(Math.random() * pool.length)];
      el.textContent = s;
      if (n >= fin.length) { clearInterval(timer); el.textContent = PROFILE.name; }
    }, 38);
  }
  setTimeout(run, 250);
  el.addEventListener('pointerenter', run);
})();

/* card tilt + metal edge + glare, and a soft spotlight (desktop pointers only) */
(function () {
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const c = $('#card'), spot = $('#spot'); let px = 0, py = 0, raf = 0;
  addEventListener('pointermove', e => {
    px = e.clientX; py = e.clientY; spot.style.opacity = 1;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; spot.style.transform = 'translate(' + px + 'px,' + py + 'px)'; });
  }, { passive: true });
  document.addEventListener('pointerleave', () => { spot.style.opacity = 0; });
  c.addEventListener('pointermove', e => {
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    c.style.transform = 'perspective(900px) rotateX(' + ((0.5 - y) * 7).toFixed(2) + 'deg) rotateY(' + ((x - 0.5) * 9).toFixed(2) + 'deg)';
    c.style.setProperty('--gx', (x * 100).toFixed(1) + '%'); c.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
    c.style.setProperty('--ang', (Math.atan2(y - 0.5, x - 0.5) * 180 / Math.PI + 180).toFixed(0) + 'deg');
  });
  c.addEventListener('pointerleave', () => { c.style.transform = ''; c.style.setProperty('--gx', '50%'); c.style.setProperty('--gy', '0%'); c.style.setProperty('--ang', '140deg'); });
})();

/* background: one smooth monochrome wave field, drawn small + stretched, ~30 fps, paused when hidden */
(function () {
  const cv = $('#bg'), g = cv.getContext('2d');
  const SCALE = 0.5; let W = 0, H = 0, t = 0, timer = 0;
  function size() { W = Math.max(2, Math.round(innerWidth * SCALE)); H = Math.max(2, Math.round(innerHeight * SCALE)); cv.width = W; cv.height = H; }
  const L = 6;
  function draw() {
    g.clearRect(0, 0, W, H);
    for (let i = 0; i < L; i++) {
      const k = i / (L - 1), base = H * (0.42 + k * 0.5), amp = H * (0.05 + k * 0.035), f = 0.0045 - k * 0.0014, sp = 0.35 + k * 0.25;
      const grd = g.createLinearGradient(0, base - amp, 0, H);
      grd.addColorStop(0, 'rgba(235,238,245,' + (0.075 - k * 0.012).toFixed(3) + ')'); grd.addColorStop(1, 'rgba(235,238,245,0)');
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) g.lineTo(x, base + Math.sin(x * f * 2 + t * sp + i * 1.7) * amp + Math.sin(x * f * 5.3 - t * sp * 0.6 + i) * amp * 0.35);
      g.lineTo(W, H); g.closePath(); g.fillStyle = grd; g.fill();
      g.strokeStyle = 'rgba(235,238,245,' + (0.10 - k * 0.025).toFixed(3) + ')'; g.lineWidth = 1; g.stroke();
    }
  }
  function loop() { t += 0.035; draw(); timer = setTimeout(loop, 33); }
  function start() { if (!timer) loop(); }
  function stop() { clearTimeout(timer); timer = 0; }
  size(); draw(); start();
  addEventListener('resize', () => { size(); draw(); });
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
})();
</script>
</body>
